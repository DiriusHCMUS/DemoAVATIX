<!doctype html><html lang=vi><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>AVA-TIX · Đăng nhập</title><link rel=stylesheet href=style.css>
<body class=auth><main class="card box"><h1 class=logo style="font-size:34px"><span>AVA</span>-TIX</h1><p class=note>Vé sự kiện chính hãng - mã QR đổi mỗi 60 giây - chống phe vé.</p>
<div class=tabs><button id=tl class=on>Đăng nhập</button><button id=tr>Đăng ký</button></div><p id=msg class=note hidden></p>
<form id=fl><label>Tên đăng nhập</label><input id=lu autocomplete=username required><label>Mật khẩu</label><input id=lp type=password autocomplete=current-password required><p><button class=btn style="width:100%;margin-top:14px">Đăng nhập</button></p></form>
<form id=fr hidden><label>Loại tài khoản</label><div class=pay><label class=r><input type=radio name=role value=customer checked>Khách hàng</label><label class=r><input type=radio name=role value=organizer>Nhà cung cấp (BTC)</label></div>
<label>Tên đăng nhập (tối thiểu 8 ký tự)</label><input id=ru minlength=8 required><label>Mật khẩu (tối thiểu 8 ký tự, 1 chữ in hoa, 1 số)</label><input id=rp type=password required>
<label>Email</label><input id=re type=email required><label>Số điện thoại</label><input id=rt inputmode=tel maxlength=10 required>
<label>Liên kết tài khoản ngân hàng</label><div class=row style="flex-wrap:nowrap"><select id=rb style="width:42%"><option>Vietcombank<option>MB Bank<option>Techcombank<option>ACB<option>BIDV<option>VPBank<option>TPBank</select><input id=rn inputmode=numeric placeholder="Số tài khoản" required></div>
<div id=cc hidden><label>Số CCCD (xác minh nhà cung cấp)</label><input id=rc inputmode=numeric maxlength=12 placeholder="12 chữ số"></div>
<p><button class=btn style="width:100%;margin-top:14px">Tạo tài khoản</button></p></form></main>
<script src=app.js></script><script>
const msg=(t,c)=>{$('#msg').hidden=!t;$('#msg').textContent=t;$('#msg').className='note '+c},sw=r=>{$('#fl').hidden=r;$('#fr').hidden=!r;$('#tl').className=r?'':'on';$('#tr').className=r?'on':'';msg('')};
$('#tl').onclick=()=>sw(0);$('#tr').onclick=()=>sw(1);
document.querySelectorAll('[name=role]').forEach(r=>r.onchange=()=>$('#cc').hidden=document.querySelector('[name=role]:checked').value!=='organizer');
$('#fl').onsubmit=async e=>{e.preventDefault();try{const d=await api('login',{username:$('#lu').value.trim(),password:$('#lp').value});location='/'+d.role+'.html'}catch(x){msg(x.message,'err')}};
$('#fr').onsubmit=async e=>{e.preventDefault();try{await api('register',{role:document.querySelector('[name=role]:checked').value,username:$('#ru').value.trim(),password:$('#rp').value,email:$('#re').value.trim(),phone:$('#rt').value.trim(),bank:$('#rb').value+' - '+$('#rn').value.trim(),cccd:$('#rc').value.trim()});
 e.target.reset();sw(0);$('#lp').value='';msg('Đăng ký thành công! Vui lòng đăng nhập bằng tài khoản vừa tạo.','good')}catch(x){msg(x.message,'err')}};
</script>
